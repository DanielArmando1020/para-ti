
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;height:100vh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,#251022,#0b0712 70%);
 font-family:Arial,sans-serif;color:white;
}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;z-index:2;text-align:center}
#heart{
 font-size:115px;cursor:pointer;user-select:none;
 filter:grayscale(.75) brightness(.7);
 transition:filter 1s,transform .5s;
 animation:beat 1.8s infinite;
}
#heart.repaired{
 filter:drop-shadow(0 0 30px #ff367e);
 animation:glow 1.5s infinite;
}
#cracks{
 position:absolute;inset:0;pointer-events:none;
 color:#ffb4cf;font-size:45px;
}
#bar{
 width:180px;height:3px;background:#ffffff18;
 margin:35px auto 0;border-radius:10px;overflow:hidden;
 opacity:.7;
}
#fill{
 height:100%;width:0%;
 background:#ff6fa7;box-shadow:0 0 12px #ff6fa7;
}
#forgive{
 opacity:0;transform:translateY(12px);
 transition:1.5s;margin-top:28px;
 color:#ffb5d1;letter-spacing:5px;font-size:15px;
}
#forgive.show{opacity:1;transform:translateY(0)}
#hint{
 margin-top:35px;font-size:11px;letter-spacing:3px;
 color:#b99aaf;opacity:.65;
}
.shard{
 position:fixed;pointer-events:none;z-index:3;
 animation:fly 1.3s ease-out forwards;
}
@keyframes beat{
 0%,100%{transform:scale(1)}
 15%{transform:scale(1.08)}
 30%{transform:scale(1)}
 45%{transform:scale(1.04)}
}
@keyframes glow{
 0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px #ff367e)}
 50%{transform:scale(1.12);filter:drop-shadow(0 0 40px #ff6caa)}
}
@keyframes fly{
 to{transform:translate(var(--x),var(--y)) rotate(180deg) scale(0);opacity:0}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<main>
 <div style="position:relative">
  <div id="heart">💔</div>
  <div id="cracks"></div>
 </div>
 <div id="bar"><div id="fill"></div></div>
 <div id="forgive">PERDÓN ❤️</div>
 <div id="hint">TOCA EL CORAZÓN</div>
</main>

<script>
const heart=document.getElementById('heart');
const fill=document.getElementById('fill');
const forgive=document.getElementById('forgive');
const hint=document.getElementById('hint');
const canvas=document.getElementById('sky');
const ctx=canvas.getContext('2d');
let progress=0,done=false,stars=[];

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
 stars=Array.from({length:120},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:Math.random()*1.5+.3,
  a:Math.random()
 }));
}
function sky(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 stars.forEach(s=>{
  s.a+=(Math.random()-.5)*.08;
  s.a=Math.max(.1,Math.min(1,s.a));
  ctx.fillStyle=`rgba(255,190,220,${s.a})`;
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 });
 requestAnimationFrame(sky);
}
resize();sky();window.addEventListener('resize',resize);

function burst(){
 const r=heart.getBoundingClientRect();
 for(let i=0;i<22;i++){
  const p=document.createElement('div');
  p.className='shard';
  p.textContent=['❤','✦','♥','✨'][Math.floor(Math.random()*4)];
  p.style.left=(r.left+r.width/2)+'px';
  p.style.top=(r.top+r.height/2)+'px';
  p.style.color=['#ff629f','#ffc2df','#fff'][i%3];
  p.style.fontSize=(10+Math.random()*18)+'px';
  p.style.setProperty('--x',(Math.random()*300-150)+'px');
  p.style.setProperty('--y',(Math.random()*300-150)+'px');
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1400);
 }
}

function touch(){
 if(done){
  burst();return;
 }
 progress=Math.min(100,progress+12.5);
 fill.style.width=progress+'%';
 heart.style.filter=`grayscale(${.75-progress*.0075}) brightness(${.7+progress*.003})`;
 heart.style.transform=`scale(${1+progress*.001})`;

 if(progress>=100){
  done=true;
  heart.textContent='❤️';
  heart.classList.add('repaired');
  heart.style.filter='';
  forgive.classList.add('show');
  hint.textContent='♡';
  burst();
  setTimeout(burst,500);
  setTimeout(burst,1100);
 }
}
heart.addEventListener('click',touch);
heart.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
